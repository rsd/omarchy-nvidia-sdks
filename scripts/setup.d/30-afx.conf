# The Audio Effects SDK (maxine-afx). Format: scripts/setup.d/README.
# Effects chosen before the build are fetched by download.sh and packaged;
# effects added after the install come from NVIDIA's download_features.sh
# in the installed features/ directory (post_script).
key=afx
title=Audio Effects SDK
package=maxine-afx
default_src=~/Downloads/maxine/afx-sdk
configure=configure.sh
checksum_glob=*.trtpkg.md5
byhand_doc=docs/download.md#afx-sdk-download-by-hand
check_doc=docs/usage.md#check-the-afx-installation
root=/opt/nvidia/maxine/afx
env_file=/usr/share/maxine-afx/maxine-afx.env
env_prefix=MAXINE_AFX
core_lib=nvafx/lib/libnv_audiofx.so
model_dir=features
model_dir_var=FEATURES_DIR
model_glob={feature}/models/{arch}/*.trtpkg
feature_lib={feature}/lib
catalogue=download.sh
catalogue_features=known_effects early_access
catalogue_early_access=early_access
catalogue_what=feature_what
catalogue_default=preset_broadcast
post_script=download_features.sh
post_args=-e {list} -o {out}
post_out=~/Downloads/maxine/afx-features
