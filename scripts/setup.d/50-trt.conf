# TensorRT (nvidia-tensorrt). Format: scripts/setup.d/README.
# One archive (.tar.zst), downloaded in a browser after the TensorRT Software
# License Agreement is accepted; no NGC, no models, no GPU architectures, no
# optional downloads. configure.sh records the archive's path (and SHA-256),
# which the PKGBUILD verifies. libnvinfer needs Arch's CUDA 13 runtime.
key=trt
title=TensorRT
package=nvidia-tensorrt
obtain=browser
download_file=TensorRT-Enterprise-{version}-Linux-x86_64-cuda-13.4-Release-external.tar.zst
licence=NVIDIA TensorRT Software License Agreement
default_src=~/Downloads
configure=configure.sh
configure_select=none
byhand_doc=docs/tensorrt.md#download
check_doc=docs/tensorrt.md#check-the-installation
root=/opt/nvidia/tensorrt
env_file=/usr/share/nvidia-tensorrt/nvidia-tensorrt.env
env_prefix=NVIDIA_TRT
core_lib=lib/libnvinfer.so
check_files=include/NvInfer.h include/NvInferVersion.h lib/pkgconfig/nvidia-tensorrt.pc
