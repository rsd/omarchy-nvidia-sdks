# The AR SDK (maxine-ar). Format: scripts/setup.d/README.
key=ar
title=AR SDK
package=maxine-ar
default_src=~/Downloads/maxine/ar-sdk
configure=configure.sh
checksum_glob=*.trtpkg.md5
byhand_doc=docs/download.md#ar-sdk-download-by-hand
check_doc=docs/usage.md#check-the-ar-installation
root=/opt/nvidia/maxine/arsdk
env_file=/usr/share/maxine-ar/maxine-ar.env
env_prefix=MAXINE_AR
core_lib=lib/libnvARPose.so
model_dir=lib/models
model_dir_var=MODEL_DIR
model_glob=*.trtpkg
catalogue=download.sh
catalogue_features=known_features
catalogue_what=feature_what
catalogue_default=preset_broadcast
