# The Optical Flow SDK (nvidia-optical-flow). Format: scripts/setup.d/README.
# One zip, downloaded in a browser after the licence is accepted; no NGC, no
# models, no GPU architectures, no optional downloads. configure.sh records
# the zip's SHA-256, which the PKGBUILD verifies.
key=of
title=Optical Flow SDK
package=nvidia-optical-flow
obtain=browser
download_file=optical_flow_sdk_{version}.zip
licence=NVIDIA DesignWorks SDK License
default_src=~/Downloads
configure=configure.sh
configure_select=none
byhand_doc=docs/optical-flow.md#download
check_doc=docs/optical-flow.md#check-the-installation
root=/opt/nvidia/optical-flow
env_file=/usr/share/nvidia-optical-flow/nvidia-optical-flow.env
env_prefix=NVIDIA_OF
check_files=include/nvOpticalFlowCuda.h include/nvOpticalFlowCommon.h
system_libs=libnvidia-opticalflow.so.1
optional_libs=fruc/lib/*.so*
