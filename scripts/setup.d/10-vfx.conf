# The Video Effects SDK (maxine-vfx). Format: scripts/setup.d/README.
key=vfx
title=Video Effects SDK
package=maxine-vfx
default_src=~/Downloads/maxine
configure=configure.sh
checksum_glob=*.trtpkg.md5
byhand_doc=docs/download.md#download-by-hand
check_doc=docs/usage.md#check-the-installation
root=/opt/nvidia/maxine/videofx
env_file=/usr/share/maxine-vfx/maxine-vfx.env
env_prefix=MAXINE_VFX
core_lib=lib/libVideoFXLocal.so
model_dir=lib/models
model_dir_var=MODEL_DIR
model_glob=*.trtpkg
catalogue=download.sh
catalogue_features=known_features
catalogue_what=feature_what
catalogue_default=preset_broadcast
